<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>祈福牆浮層示範</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/*
  牆面浮層示範：主視覺區內人工核准的安全矩形，完全不進卡牆區。
  牆面座標以 2160×3840 原圖為準；安全矩形 = 主視覺下緣的遶境地面帶（y 1530–1775），
  不碰 QR、廟名、主標、「掃碼許新春願」、中央神轎。
*/
:root{
  --red:#7A2A24; --gold:#C99B54; --paper:#F7F3EC; --paper-deep:#E8DDCE; --wood:#3E2F26; --muted:#5B4A40; --line:#DED5C9;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  /* 安全矩形（佔整面牆的百分比） */
  --safe-l:2%; --safe-r:2%; --safe-t:39.84%; --safe-h:6.38%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#1B1411;color:var(--paper);font:400 16px/1.6 var(--sans)}
button{font:inherit;color:inherit}

.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}

/* 55 吋直式螢幕 */
.screen{flex:none;height:calc(100dvh - 48px);aspect-ratio:2160/3840;max-width:calc(100vw - 48px);padding:1.1%;background:#0C0908;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px #2B211C}
.wall{position:relative;width:100%;height:100%;overflow:hidden;background:#3a1d18;container-type:size}
.canvas{position:absolute;left:0;top:0;width:100%;aspect-ratio:2160/3840;background:url("dajia-wall.jpg") center/100% 100% no-repeat}
/* 近看：只顯示上方 2160×1780 主視覺，放大到整個寬度 */
.screen.zoom{aspect-ratio:2160/1780;height:auto;width:min(calc(100vw - 420px),calc((100dvh - 48px) * 2160 / 1780))}

/* 安全矩形：平常什麼都沒有，只在示範時顯示框線 */
.safe{position:absolute;left:var(--safe-l);right:var(--safe-r);top:var(--safe-t);height:var(--safe-h);overflow:hidden}
.safe.show{outline:.35cqw dashed #FFD66B;outline-offset:-.35cqw;background:rgba(255,214,107,.12)}
.safe .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:.8cqw;font:700 1.9cqw/1 var(--sans);color:#3A2208;background:#FFD66B;padding:.5cqw 1cqw;border-radius:.5cqw;opacity:0;transition:opacity .3s}
.safe.show .tag{opacity:1}

/* 小香客：與手機殿前同一套素材 */
.fig{position:absolute;bottom:3%;height:92%;transform:translateX(-50%);transition-property:left,opacity;transition-timing-function:linear,ease;transition-duration:2s,.6s;filter:drop-shadow(0 .4cqw .5cqw rgba(0,0,0,.45));z-index:2}
.fig img{display:block;height:100%;width:auto;transform-origin:50% 96%;transition:transform .5s var(--ease);user-select:none;-webkit-user-drag:none}
.fig.walk img{animation:wobble .36s ease-in-out infinite alternate}
.fig.flip{scale:-1 1}
.fig.bow img{transform:scaleY(.94) translateY(2px) rotate(-2deg)}
.fig.out{opacity:0}
/* 後排：稍高、稍小、在前排後面，八個人站得下又像一群人 */
.fig.back{bottom:16%;height:78%;z-index:1;filter:drop-shadow(0 .3cqw .4cqw rgba(0,0,0,.4)) brightness(.94)}
@keyframes wobble{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-3px)}}

/* 祝福牌：左右兩組香客與中央神轎之間，留在安全矩形內，不遮神轎 */
.plaque{position:absolute;top:50%;z-index:3;max-width:25%;padding:.9cqw 1.4cqw;background:rgba(251,245,233,.96);border:.28cqw solid var(--gold);border-radius:.6cqw;color:var(--red);font:700 2.4cqw/1.35 var(--serif);white-space:nowrap;opacity:0;transform:translateY(-40%);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.plaque.on{opacity:1;transform:translateY(-50%)}
.plaque small{display:block;margin-top:.3cqw;font:500 1.7cqw/1.3 var(--sans);color:var(--muted)}
.plaque.arrive{font:700 2.3cqw/1.3 var(--sans);color:var(--wood);padding:.8cqw 1.5cqw}

/* 示範控制台（不在牆上） */
.panel{width:320px;flex:none}
.panel h1{margin:0 0 4px;font:700 22px/1.35 var(--serif);color:var(--paper)}
.panel .lede{margin:0 0 20px;font-size:14px;color:#BFB2A3}
.btns{display:grid;gap:10px}
.btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:10px 16px;border:1px solid #4A3A31;border-radius:12px;background:#2A201B;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.btn:hover{background:#33271F;border-color:#6A5444}
.btn:active{transform:scale(.98)}
.btn b{font-size:16px;font-weight:700;color:var(--paper)}
.btn span{font-size:13px;color:#BFB2A3}
.btn.primary{background:#E4745E;border-color:#E4745E}
.btn.primary b,.btn.primary span{color:#fff}
.btn.primary:hover{background:#D9654F}
.btn:focus-visible,.switch input:focus-visible + i{outline:3px solid var(--gold);outline-offset:2px}
.switches{display:grid;gap:4px;margin:18px 0;padding:12px 0;border-top:1px solid #3A2E27;border-bottom:1px solid #3A2E27}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:15px;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{position:relative;width:44px;height:26px;border-radius:99px;background:#4A3A31;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#F7F3EC;transition:transform .2s var(--ease)}
.switch input:checked + i{background:#E4745E}
.switch input:checked + i::after{transform:translateX(18px)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:#D8CCBE}
.rules li{display:flex;gap:10px}
.rules li::before{content:"";flex:0 0 6px;height:6px;margin-top:9px;border-radius:50%;background:var(--gold)}
.log{margin-top:18px;min-height:44px;font-size:14px;color:#FFD66B}

@media (max-width:820px){
  .page{flex-direction:column;gap:24px;padding:16px}
  .screen,.screen.zoom{height:auto;width:100%;max-width:440px}
  .panel{width:100%;max-width:440px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="page">
  <div class="screen" aria-label="祈福牆 55 吋直式螢幕">
    <div class="wall" id="wall">
      <div class="canvas">
        <div class="safe" id="safe">
          <span class="tag">安全矩形（人工核准）</span>
        </div>
      </div>
    </div>
  </div>

  <aside class="panel">
    <h1>牆面浮層示範</h1>
    <p class="lede">大甲鎮瀾宮新春祈福牆。小香客只出現在主視覺下緣的安全矩形裡，12 張祈福卡完全不會被遮到。</p>

    <div class="btns">
      <button class="btn primary" id="bAuto" type="button"><b>自動示範：開</b><span>依序播放入場、送祝福、多人合併</span></button>
      <button class="btn" id="bOpen" type="button"><b>有人掃碼開頁</b><span>小香客走進殿前，站著等</span></button>
      <button class="btn" id="bSend" type="button"><b>有人送出祝福</b><span>合掌低頭，出現那句祝福，約 6 秒後離開</span></button>
      <button class="btn" id="bBurst" type="button"><b>同時很多人送祝福</b><span>最多 8 位，其餘合併成「另有 N 份」</span></button>
    </div>

    <div class="switches">
      <label class="switch"><span>只看主視覺（放大）</span><input type="checkbox" id="sZoom"><i></i></label>
      <label class="switch"><span>顯示安全矩形</span><input type="checkbox" id="sSafe"><i></i></label>
      <label class="switch"><span>後台停用浮層</span><input type="checkbox" id="sOff"><i></i></label>
    </div>

    <ul class="rules">
      <li>只在主視覺的安全矩形內，不進卡牆、不碰 QR、主標與神轎</li>
      <li>只演真實事件，沒人掃碼時什麼都不出現</li>
      <li>每次最長 8 秒，同時最多 8 位</li>
      <li>牆上不標「你」，也不顯示地區</li>
    </ul>
    <p class="log" id="log" role="status" aria-live="polite"></p>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const PEOPLE = ['grandma','grandpa','woman','man-cap','child','uncle-hat','student','office'];
PEOPLE.forEach(f => { const i = new Image(); i.src = `../assets/people/${f}.webp`; });
// 牆上用句庫的短版（8 字內），55 吋螢幕 3–5 公尺看得清楚
const PHRASES = ['願全家平安順遂','願考試金榜題名','願工作貴人相助','願爸媽身體健康','願生意興隆','願羊年開泰'];
// 站位（安全矩形寬度的百分比）：中央 47–58% 是神轎，香客分站兩側，每側前排 2 位、後排 2 位
const SLOTS = [
  { x:3 }, { x:11 }, { x:7, back:true }, { x:15, back:true },
  { x:97 }, { x:89 }, { x:93, back:true }, { x:85, back:true }
];
const MAX = 8, HOLD = 6000, WAIT = 15000, WALK = 0.05; // WALK：每移動 1% 寬度需要的秒數

const S = { n: 36, off: false, auto: true };
const actors = [];
let extra = 0, extraT = null;

function log(t){ $('#log').textContent = t; }
function rnd(a){ return a[Math.floor(Math.random() * a.length)]; }

function walkTo(a, x, done){
  const from = parseFloat(a.el.style.left) || 0, dur = Math.max(.8, Math.abs(x - from) * WALK);
  a.el.classList.add('walk');
  a.el.classList.toggle('flip', x < from);
  a.el.style.transitionDuration = dur + 's, .6s';
  a.el.style.left = x + '%';
  clearTimeout(a.walkT);
  a.walkT = setTimeout(() => { a.el.classList.remove('walk', 'flip'); done && done(); }, dur * 1000);
}
function freeSlot(){
  const used = actors.filter(a => !a.leaving).map(a => a.slot);
  const free = SLOTS.map((_, i) => i).filter(i => !used.includes(i));
  return free.length ? rnd(free) : -1;
}
function enter(){
  if (S.off) return null;
  if (actors.filter(a => !a.leaving).length >= MAX) return null;
  const slot = freeSlot(); if (slot < 0) return null;
  const x = SLOTS[slot].x, el = document.createElement('div');
  el.className = 'fig' + (SLOTS[slot].back ? ' back' : '');
  el.innerHTML = `<img src="../assets/people/${rnd(PEOPLE)}.webp" alt="" draggable="false">`;
  el.style.left = x < 50 ? '-8%' : '108%';
  $('#safe').appendChild(el);
  const a = { el, slot, x, leaving:false, state:'arrive' };
  actors.push(a);
  requestAnimationFrame(() => requestAnimationFrame(() => walkTo(a, x, () => { a.arrived = true; a.onArrive && a.onArrive(); })));
  // 開頁 15 秒內沒送出就離開，不做祈福動作
  a.waitT = setTimeout(() => { if (a.state === 'arrive') leave(a); }, WAIT);
  return a;
}
function leave(a){
  if (a.leaving) return;
  a.leaving = true; clearTimeout(a.waitT); clearTimeout(a.holdT);
  a.el.classList.remove('bow');
  if (a.plaque) hidePlaque(a.plaque);
  walkTo(a, a.x < 50 ? -8 : 108, () => { a.el.remove(); const i = actors.indexOf(a); if (i > -1) actors.splice(i, 1); });
}
function plaque(a, html, cls){
  document.querySelectorAll('.plaque').forEach(hidePlaque); // 一次只顯示一則
  const p = document.createElement('div');
  p.className = 'plaque' + (cls ? ' ' + cls : '');
  p.innerHTML = html;
  // 左側香客的牌子在 20–45%，右側的在 59–81%，都不碰中央神轎
  if (a.x < 50) p.style.left = '20%'; else p.style.right = '19%';
  $('#safe').appendChild(p);
  requestAnimationFrame(() => p.classList.add('on'));
  a.plaque = p;
  return p;
}
function hidePlaque(p){ p.classList.remove('on'); setTimeout(() => p.remove(), 450); }

// W1：有人從這台 QR 開頁
function open(){
  if (S.off) { log('浮層已停用，牆面維持原畫面'); return null; }
  const a = enter();
  if (!a) { log('殿前已有 8 位，這次不另外入場'); return null; }
  a.onArrive = () => { if (a.state === 'arrive') { plaque(a, '有人來到殿前', 'arrive'); setTimeout(() => a.plaque && a.state === 'arrive' && hidePlaque(a.plaque), 2600); } };
  log('W1｜有人掃碼開頁：小香客走進殿前');
  return a;
}
// W3：快速祝福成立
function send(){
  if (S.off) { log('浮層已停用，牆面維持原畫面'); return; }
  let a = actors.find(x => !x.leaving && x.state === 'arrive');
  if (!a) a = enter();
  if (!a) { bumpExtra(); return; }
  a.state = 'bless'; clearTimeout(a.waitT);
  const go = () => {
    S.n++;
    a.el.classList.add('bow');
    plaque(a, `${rnd(PHRASES)}<small>${countLine()}</small>`);
    a.holdT = setTimeout(() => leave(a), HOLD); // 4–6 秒後淡出，最長 8 秒
  };
  a.arrived ? go() : (a.onArrive = go);
  log('W3｜祝福送出：合掌低頭，出現那句祝福');
}
function countLine(){ return `今天第 ${S.n} 份祝福` + (extra ? `・另有 ${extra} 份` : ''); }
// W4：超過 3 人時合併，寫在目前那塊祝福牌的第二行
function bumpExtra(){
  extra++; S.n++;
  const sm = document.querySelector('.plaque.on small'); if (sm) sm.textContent = countLine();
  clearTimeout(extraT); extraT = setTimeout(() => { extra = 0; }, 8000);
  log('W4｜超過 8 位：其餘合併成「另有 N 份」');
}
function burst(){
  if (S.off) { log('浮層已停用，牆面維持原畫面'); return; }
  for (let i = 0; i < 11; i++) setTimeout(send, i * 380); // 8 位上場，另外 3 份合併
}
function clearAll(){
  actors.forEach(a => { a.leaving = true; clearTimeout(a.waitT); clearTimeout(a.holdT); clearTimeout(a.walkT); a.el.remove(); });
  actors.length = 0;
  document.querySelectorAll('.plaque').forEach(p => p.remove());
  extra = 0;
}

/* 自動示範：開頁 → 送祝福 → 有人開頁沒送就走 → 多人合併 → 安靜一段時間 */
const SCRIPT = [
  [1500, open], [3800, send],
  [9000, open], [2500, send], [1200, open],
  [8000, send],
  [9000, burst],
  [14000, () => log('沒有事件時，牆面就是原本的主視覺')]
];
let autoT = null, step = 0;
function runAuto(){
  clearTimeout(autoT);
  if (!S.auto) return;
  const [ms, fn] = SCRIPT[step];
  autoT = setTimeout(() => { fn(); step = (step + 1) % SCRIPT.length; runAuto(); }, ms);
}
function setAuto(on){
  S.auto = on;
  $('#bAuto').querySelector('b').textContent = on ? '自動示範：開' : '自動示範：關';
  $('#bAuto').classList.toggle('primary', on);
  if (on) { step = 0; runAuto(); } else clearTimeout(autoT);
}

$('#bAuto').onclick = () => setAuto(!S.auto);
['#bOpen','#bSend','#bBurst'].forEach(id => $(id).addEventListener('click', () => setAuto(false)));
$('#bOpen').addEventListener('click', open);
$('#bSend').addEventListener('click', send);
$('#bBurst').addEventListener('click', burst);
$('#sZoom').onchange = e => document.querySelector('.screen').classList.toggle('zoom', e.target.checked);
$('#sSafe').onchange = e => $('#safe').classList.toggle('show', e.target.checked);
$('#sOff').onchange = e => {
  S.off = e.target.checked;
  if (S.off) { clearAll(); log('W5｜後台停用：不出現任何浮層'); } else log('浮層已恢復');
};

runAuto();
</script>
</body>
</html>
