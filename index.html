<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<title>北港朝天宮・殿前祈福</title>
<link rel="preconnect" href="https://lifemap.miniapp.tw">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/*
  視覺規格「當代廟宇工藝・輕量版」（Claude × ChatGPT 收斂）：
  - 宮廟感只來自三處：正殿直播、殿前剪紙香客、送祝福的紅籤條。其他元件回到簡潔可讀。
  - 六色：硃紅 #7A2A24、暖金 #C99B54、紙白 #F7F3EC、淡紙褐 #E8DDCE、木褐 #3E2F26、灰褐 #8B8073。
  - 標題與祝福句用思源宋體，功能文字用思源黑體。
  - 不用常駐陰影、不用祥雲屋簷梅花、不用圖示庫。主按鈕圓角 10px，籤條 4px，心願卡 6px。
  - 頁首維持紙白：Lifemap 標誌是紅字，放在深紅底上會看不見。
*/
:root{
  --red:#7A2A24; --red-press:#652019; --gold:#C99B54;
  --paper:#F7F3EC; --paper-deep:#E8DDCE; --wood:#3E2F26; --wood-2:#30231D; --muted:#5B4A40; --line:#DED5C9;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9E2D8;color:var(--wood);font:400 16px/1.65 var(--sans)}
button{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:calc(var(--dock-h,140px) + 28px)}
.app.nosticky{padding-bottom:0}

/* 頁首（不固定：固定頁首捲動時會蓋到直播播放器） */
.hdr{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--paper-deep)}
.hdr img{height:26px;width:auto;display:block}

/* 廟名列 */
.venue{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px}
.venue h1{margin:0;font:700 22px/1.3 var(--serif);letter-spacing:.04em;text-wrap:balance}
.venue p{margin:4px 0 0;font-size:14px;font-weight:500;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on{color:var(--red)}
.live.on i{background:#C0392B;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* 正殿直播：高度 = max(200px, 寬 × 9/16)，播放器上方不放任何元素 */
.media{position:relative;width:100%;background:#1E1612}
.media .yt,.media .yt iframe{width:100%;height:100%;display:block;border:0}
.fallback{position:absolute;inset:0;background:#2A1C16 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--paper);text-align:center;font-size:15px}
.fallback::before{content:"";position:absolute;inset:0;background:rgba(30,22,18,.62)}
.fallback > *{position:relative}
.fallback .tag{position:absolute;left:12px;top:12px;font-size:13px;color:var(--paper-deep)}
.fallback a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:10px;background:var(--paper);color:var(--red);font-weight:700;text-decoration:none}
.fallback .bar{width:120px;height:2px;background:rgba(247,243,236,.25);overflow:hidden}
.fallback .bar::after{content:"";display:block;width:40%;height:100%;background:var(--gold);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* 殿前照片：剪紙香客直接疊在廟方照片上（照片是自有素材，可以疊加；YouTube 播放器不行） */
.scene{position:absolute;inset:0;overflow:hidden;background:#2A1C16 url("assets/temple.jpg") center/cover no-repeat;transition:background-position .45s var(--ease)}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(rgba(20,12,9,0),rgba(20,12,9,.28));pointer-events:none}
.media.crop .scene{background-position:center 92%}
/* Q 版香客：走進來時左右搖晃，到定點合掌低頭 */
.scene .figure{bottom:auto;width:auto;height:calc(92px * var(--s,1));transition-property:left,opacity;transition-timing-function:linear,ease;transition-duration:2s,.6s;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.media.crop .scene .figure{height:calc(72px * var(--s,1))}
.scene .figure img{display:block;height:100%;width:auto;transform-origin:50% 96%;transition:transform .5s var(--ease);user-select:none;-webkit-user-drag:none}
.scene .figure.bow img{transform:scaleY(.94) translateY(2px) rotate(-2deg)}
.scene .figure svg{transform-origin:50% 96%}
.scene .figure.walk svg,.scene .figure.walk img{animation:wobble .36s ease-in-out infinite alternate}
.scene .figure.flip{scale:-1 1}
.scene .figure.flip .me{scale:-1 1}
@keyframes wobble{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-3px)}}
.scene .figure .arm{transform-box:fill-box;transform-origin:50% 12%;transition:transform .5s var(--ease)}
.scene .figure.bow svg{transform:none}
.scene .figure.bow .head{transform:translateY(5px)}
.scene .figure.bow .arm.l{transform:rotate(-24deg)}
.scene .figure.bow .arm.r{transform:rotate(24deg)}
.scene .figure.mine::before{content:"";position:absolute;left:50%;bottom:-4px;width:120%;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,214,120,.85),rgba(255,214,120,0) 70%)}
.scene .figure .me{color:#3A2208;background:var(--gold);border-radius:999px;padding:0 8px;line-height:18px;top:-22px}
.scene .plaque{z-index:30;top:auto;max-width:50%;width:auto;transform:translateY(-4px);font-size:14px;padding:4px 10px}
.scene .plaque.on{transform:none}
.scene .plaque small{display:block;margin:0}
/* 神像在照片中央 40–60%：祝福牌靠左或靠右，不遮神像 */
.scene .plaque.l{left:3%!important;text-align:left}
.scene .plaque.r{left:auto!important;right:3%;text-align:right}
.scene .overflow{bottom:10px;color:#FFF3DF;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 16px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}
.modebar button{border:0;background:none;color:var(--red);font-size:15px;font-weight:600;min-height:44px;padding:0;cursor:pointer}
.modebar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 香客與祝福牌基本樣式 */
.figure{position:absolute;bottom:10px;width:40px;height:60px;transform:translateX(-50%);transition:left 1.1s var(--ease),opacity .5s;z-index:2}
.figure svg{width:100%;height:100%;overflow:visible;transform-origin:50% 95%;transition:transform .6s var(--ease)}
.figure .head{transition:transform .6s var(--ease)}
.figure.bow svg{transform:rotate(-6deg)}
.figure.bow .head{transform:translateY(3px)}
.figure.out{opacity:0}
.figure .me{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:.1em}
.plaque{position:absolute;top:10px;left:50%;transform:translate(-50%,-4px);z-index:3;max-width:calc(100% - 32px);width:max-content;background:var(--paper);color:var(--wood);border:1px solid var(--gold);border-radius:4px;padding:4px 14px;font:600 15px/1.5 var(--serif);text-align:center;opacity:0;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.plaque.on{opacity:1;transform:translate(-50%,0)}
.plaque small{font:400 12px/1.4 var(--sans);color:var(--muted);margin-left:8px}
.overflow{position:absolute;right:16px;bottom:24px;font-size:13px;color:var(--paper-deep);z-index:3}

/* 內容 */
.sec{padding:24px 16px 0;animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h2{margin:0 0 14px;font:700 21px/1.4 var(--serif);letter-spacing:.02em;text-wrap:balance}
.lead{margin:-6px 0 16px;font-size:15px;color:var(--muted)}

.ticker{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.wish{flex:0 0 82%;scroll-snap-align:start;background:#ECE6DD;border-left:3px solid var(--red);border-radius:6px;padding:14px 16px}
.wish p{margin:0;font:600 17px/1.5 var(--serif)}
.wish{display:flex;flex-direction:column;gap:8px}
.wmeta{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted)}
.wtype{padding:1px 8px;border:1px solid #D9B9AE;border-radius:4px;color:var(--red);font-weight:700;background:#F7EDE8}
.wish p{flex:1}
/* 集氣：次要按鈕，不跟底部主按鈕搶 */
.wfoot{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.cheer{min-height:44px;padding:0 16px;border:1.5px solid var(--red);border-radius:22px;background:var(--paper);color:var(--red);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s var(--ease)}
.cheer:active{transform:scale(.97)}
.cheer.busy{opacity:.6;cursor:default}
.cheer.done{border-color:var(--gold);background:#F3E6CF;color:var(--wood);cursor:default;animation:pop .35s var(--ease)}
.cheer.fail{border-style:dashed}
@keyframes pop{40%{transform:scale(1.08)}}
.look{font-size:14px;font-weight:500;color:var(--red)}
/* 查看全部：在同一頁改成直排 */
.ticker.all{flex-direction:column;overflow:visible;margin:0;padding:0}
.ticker.all .wish{flex:none}
.allbtn{display:block;width:100%;min-height:48px;margin-top:8px;border:0;background:none;color:var(--wood);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.cheer:focus-visible,.allbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.today{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding:16px 0;border-top:1px solid var(--line)}
.today div + div{border-left:1px solid var(--line);padding-left:16px}
.today strong{display:block;font-size:28px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.15;margin-bottom:2px}
.today span{font-size:15px;font-weight:500}
.more-link{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-top:4px;color:var(--wood);border-top:1px solid var(--line);border-bottom:1px solid var(--paper-deep);text-decoration:none;font-size:16px;font-weight:500}
.more-link span:last-child{color:var(--muted);font-size:20px}

/* 送祝福：主題頁籤＋紅籤條 */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;min-height:48px;padding:0;font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--wood);font-weight:700}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.slips{display:flex;flex-direction:column;gap:10px}
.slip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;text-align:left;border:1px solid #E9C9C0;border-left:5px solid var(--red);background:#F8E7E1;border-radius:4px;padding:12px 16px;font:600 18px/1.45 var(--serif);color:var(--wood);cursor:pointer;transition:background .2s,color .2s,transform .15s var(--ease)}
.slip:active{transform:scale(.99)}
.slip .tick{font:700 15px var(--sans);color:var(--gold)}
.slip[aria-checked="true"]{background:var(--red);color:var(--paper);border-color:var(--gold)}
.slip[aria-checked="true"] .tick{opacity:1}
.slip:disabled{cursor:default}
.slip:disabled:not([aria-checked="true"]){opacity:.4}
/* 朱印：快速祝福被接受後才蓋，不代表正式卡審核或牆面已播放 */
.stamp{position:absolute;right:16px;top:50%;width:52px;height:52px;margin-top:-26px;border:2px solid #E7B9AE;color:#F7E4DE;display:grid;place-items:center;font:700 15px/1.15 var(--serif);text-align:center;opacity:0;transform:scale(1.25) rotate(-5deg);pointer-events:none}
.stamp.on{animation:stamp .26s ease-out forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-3deg)}}


/* 底部主按鈕列（播放器在頁首；底部留白等高，不會蓋到播放器） */
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);text-align:center}
.app.nosticky .dock{position:static;transform:none;margin-top:24px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:30px;background:#E4745E;color:#fff;font-size:18px;font-weight:700;letter-spacing:.06em;box-shadow:0 6px 16px rgba(228,116,94,.35);cursor:pointer;text-decoration:none;transition:background .15s,transform .15s var(--ease)}
.cta:active{background:#CF5F49;transform:scale(.98)}
.cta:disabled{background:#E8DDCE;color:#5B4A40;box-shadow:none;cursor:not-allowed}
.titlebar{display:flex;align-items:center;gap:8px;margin:-8px 0 10px}
.titlebar .h2{margin:0}
.backtop{display:inline-flex;align-items:center;min-height:48px;margin-left:-6px;padding:0 6px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
/* 送出後主按鈕上方的說明：讓人知道按下去會複製祝福 */
.dockhint{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--muted)}
.dockhint b{color:var(--wood);font-weight:700}
.stamp.still{animation:none;opacity:1;transform:rotate(-3deg)}
/* 首頁三步說明：讓第一次來的人知道按下去會發生什麼 */
.steps3{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px 8px;min-height:28px;margin:0 0 10px;padding:0;list-style:none;font-size:14px;font-weight:500;color:var(--muted)}
.steps3 li{display:flex;align-items:center;gap:5px;white-space:nowrap}
.steps3 li + li::before{content:"›";color:#8B8073;margin-right:8px}
.steps3 b{display:none}
.cta:focus-visible,.backtop:focus-visible,.slip:focus-visible,.tabs button:focus-visible,.more-link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stamp.on{opacity:1;transform:rotate(-3deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <img src="https://maitemple.s3.ap-northeast-1.amazonaws.com/temple/0OIPdI35qsi2nOvJV4jI/mini_app/header_logo_0OKe6VOuuaPb8Vhc9yIA.jpeg" alt="人生地圖 Lifemap">
  </header>

  <section class="venue" aria-label="場域">
    <div>
      <h1>北港朝天宮・正殿</h1>
      <p id="presence"></p>
    </div>
    <span class="live" id="liveChip"><i></i><span id="liveText">連線中</span></span>
  </section>

  <div class="media" id="media">
    <div class="scene" id="scene" aria-label="殿前">
      <span class="overflow" id="overflow"></span>
    </div>
    <div class="yt" id="yt"></div>
    <div class="fallback" id="fallback" hidden></div>
  </div>
  <div class="modebar">
    <span id="modeNote"></span>
    <button type="button" id="modeBtn">看即時直播 ›</button>
  </div>

  <main id="view"></main>

  <div class="dock" id="dock"></div>
</div>

<script>
/* ===== 設定 ===== */
const CFG = {
  videoId: 'B12MobI0EGg',
  youtubeUrl: 'https://www.youtube.com/live/B12MobI0EGg',
  photo: 'https://i.ytimg.com/vi/B12MobI0EGg/hqdefault.jpg', // 直播斷線時的備援畫面
  groupUrl: 'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/',
  topics: [
    { id:'study', name:'學業', product:'金榜題名祈福卡', side:'金榜題名',
      apply:'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/apply/item/0OjUzsvZSiV2nNhPtu8p/?neworder=true',
      phrases:['願考試順利，金榜題名','願讀書專注，心定不慌','願努力都有好結果'] },
    { id:'career', name:'事業', product:'業績長紅祈福卡', side:'業績長紅',
      apply:'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/apply/item/0P1f6x1i2RH_NpRKm0FD/?neworder=true',
      phrases:['願工作順心，貴人相助','願生意興隆，訂單滿滿','願升遷順利，一路長紅'] }
  ]
};
// 其他香客的祝福句（之後改由後端 venue_event 提供）
const OTHERS = ['願考試順利，金榜題名','願工作順心，貴人相助','願讀書專注，心定不慌','願生意興隆，訂單滿滿','願努力都有好結果'];
// 此刻在這面牆上輪播的付費祈福卡（已付費、審核通過；之後改由後端 wall_cards 提供，順序＝牆面輪播順序）
const WALL_CARDS = [
  { id:'c01', type:'金榜題名卡', name:'林雅婷', w:'願女兒考試順利，考上第一志願' },
  { id:'c02', type:'業績長紅卡', name:'陳建宏', w:'願今年業績長紅，客戶都順利成交' },
  { id:'c03', type:'金榜題名卡', name:'張書豪', w:'願學測考出好成績，不辜負爸媽' },
  { id:'c04', type:'業績長紅卡', name:'麵包店老闆娘', w:'願麵包店生意興隆，員工平安' },
  { id:'c05', type:'金榜題名卡', anon:true,     w:'願國考一次上榜，家人安心' },
  { id:'c06', type:'業績長紅卡', name:'歐陽志明', w:'願新工作順利，早日存到頭期款' },
  { id:'c07', type:'金榜題名卡', name:'想念兒子的媽媽', w:'願兒子研究所順利畢業' },
  { id:'c08', type:'業績長紅卡', name:'Amy',    w:'願公司訂單滿滿，貴人相助' },
  { id:'c09', type:'金榜題名卡', name:'李佳穎', w:'願證照考試全部通過' },
  { id:'c10', type:'業績長紅卡', name:'吳振宇', w:'願升遷順利，一路長紅' },
  { id:'c11', type:'金榜題名卡', name:'小雅',   w:'願孫子會考順利，讀書專注' },
  { id:'c12', type:'業績長紅卡', name:'劉俊傑', w:'願開店順利，客人吃得歡喜' }
];
const HOME_CARDS = 3; // 首頁先列 3 張，其餘按「查看全部」在同一頁展開
// 祈福人：暱稱照牆上原樣顯示；只有真名才隱碼（2 字 陳○、3 字 王○明、4 字留頭尾、英文只留首字母）；選匿名＝匿名祈福人
// 正式版請以表單或後端的 name_kind（real／nickname）判斷；沒有欄位時才用下面的規則推測，推測不出來一律當真名隱碼
const SURNAMES = '陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴徐周葉蘇莊呂江何蕭羅高潘簡朱鍾游彭詹胡施沈余盧梁趙顏柯翁魏孫戴范方宋鄧杜傅侯曹薛丁卓阮馬董温唐藍石蔣古紀姚連馮歐程湯黃田康姜白汪鄒尤巫鐘黎涂龔嚴韓袁金童陸夏柳凃邵錢伍倪溫于譚駱熊任甘秦顧毛章史官萬俞雷粘饒張闕凌崔尹孔辛武辜陶段龍韋葛池孟褚殷麥賀賈莫文管關向包丘梅華利裴樊房全佘左花';
const SURNAMES2 = ['歐陽','司馬','諸葛','上官','司徒','張簡','范姜','東方','皇甫','夏侯'];
function isRealName(s){
  if (/^[A-Za-z][a-z]+(\s[A-Za-z][a-z]+)?$/.test(s)) return true; // 英文名一律當真名
  if (!/^[一-鿿]{2,4}$/.test(s)) return false;           // 有地名、稱謂、句子 → 暱稱
  if (SURNAMES2.some(x => s.startsWith(x))) return s.length >= 3;
  return SURNAMES.includes(s[0]) && s.length <= 3 && !/[媽爸嬤公婆哥姐姊弟妹叔姨仔娘伯]/.test(s.slice(1));
}
function maskName(c){
  if (c.anon || !c.name) return '匿名祈福人';
  const s = c.name.trim(), n = [...s];
  if (!isRealName(s)) return s;
  if (/^[A-Za-z]/.test(n[0])) return n[0].toUpperCase() + '••';
  if (n.length === 2) return n[0] + '○';
  return n[0] + '○'.repeat(n.length - 2) + n[n.length - 1];
}

function saveCheered(){ try { localStorage.setItem('qifu-cheered', JSON.stringify([...cheered])); } catch(e){} }

const S = {

  step:'home', topic:CFG.topics[0], phrase:null, sent:false, wall:null,

/* ===== 正殿直播 ===== */
let yt = null, ytReady = false, stallT = null;
function canEmbed(){ return $('#media').clientWidth >= 300 && window.innerHeight >= 560; }
function sizeMedia(){
  document.querySelector('.modebar').hidden = S.step !== 'home';
  document.querySelector('.venue').hidden = S.step !== 'home'; // 選句時不重複顯示廟名，把空間留給籤條
  const w = $('#media').clientWidth;
  const crop = S.step !== 'home' && S.mode === 'photo'; // 選句頁只留殿前地面一條，讓籤條一進頁就看得到
  $('#media').classList.toggle('crop', crop);
  $('#media').style.height = crop ? (S.sent ? '128px' : '150px') // 送出後按鈕上方多一行說明，照片再縮一點讓籤條不被蓋到
    : S.mode === 'live' ? Math.max(200, Math.round(w * 9 / 16)) + 'px' // 直播維持 16:9，不裁切播放器
    : Math.max(260, Math.round(w * 0.85)) + 'px';
  $('#app').classList.toggle('nosticky', window.innerHeight < 560);
}
function uiState(){
  if (S.source === 'none') return 'none';
  if (!canEmbed()) return 'small';
  if (S.source === 'offline') return 'offline';
  if (S.player === 'playing') return 'live';
  if (S.player === 'blocked') return 'blocked';
  if (S.player === 'error' || S.player === 'stalled') return 'error';
  return 'connecting';
}
function renderMedia(){
  const photo = S.mode === 'photo';
  $('#scene').hidden = !photo;
  $('#modeNote').textContent = photo ? '殿前香客即時動態' : '正殿 24 小時直播';
  $('#modeBtn').textContent = photo ? '看直播 ›' : '回殿前 ›';
  if (photo) {
    $('#yt').style.visibility = 'hidden';
    $('#fallback').hidden = true;
    $('#liveText').textContent = '殿前互動';
    $('#liveChip').classList.remove('on');
    return;
  }
  const st = uiState(), fb = $('#fallback');
  // 播放器準備好就保持可見（隱藏會被 YouTube 暫停）；自動播放被擋時直接露出 YouTube 自己的播放鍵
  const showYt = st === 'live' || (ytReady && (st === 'connecting' || st === 'blocked'));
  $('#yt').style.visibility = showYt ? 'visible' : 'hidden';
  fb.hidden = showYt;
  fb.style.backgroundImage = `url("${CFG.photo}")`;
  const M = {
    connecting:['連線中',false,'<div>直播連線中</div><div class="bar"></div>'],
    live:['直播中',true,''],
    blocked:['點播放看直播',true,''],
    error:['暫停',false,'<div>直播暫時無法播放</div>'],
    offline:['照片',false,'<span class="tag">廟內照片</span><div>直播暫停，先看看廟內</div>'],
    none:['照片',false,'<span class="tag">廟內照片</span>'],
    small:['直播中',true,`<div>畫面較小，請到 YouTube 觀看</div><a href="${CFG.youtubeUrl}" target="_blank" rel="noopener">觀看直播</a>`]
  }[st];
  $('#liveText').textContent = M[0];
  $('#liveChip').classList.toggle('on', M[1]);
  fb.innerHTML = M[2];
}
window.onYouTubeIframeAPIReady = function(){
  if (!canEmbed()) { renderMedia(); return; }
  yt = new YT.Player('yt', {
    videoId: CFG.videoId,
    playerVars: { autoplay:1, mute:1, playsinline:1, rel:0, controls:1 },
    events: {
      onReady: e => {
        ytReady = true; renderMedia(); // 先讓播放器可見，再要求播放
        e.target.mute(); e.target.playVideo();
        setTimeout(() => { if (S.player !== 'playing') { S.player = 'blocked'; renderMedia(); } }, 5000);
      },
      onStateChange: e => {
        const P = YT.PlayerState; clearTimeout(stallT);
        if (e.data === P.PLAYING) S.player = 'playing';
        else if (e.data === P.BUFFERING) { if (S.player !== 'playing') S.player = 'loading'; stallT = setTimeout(() => { S.player = 'stalled'; renderMedia(); }, 20000); }
        else if (e.data === P.ENDED) S.player = 'error';
        else if (e.data === P.PAUSED) S.player = 'blocked';
        renderMedia();
      },
      onError: () => { S.player = 'error'; renderMedia(); } // 只代表這支手機播不了，不改後端的直播狀態
    }
  });
};
function loadYT(){
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { S.player = 'error'; renderMedia(); };
  document.head.appendChild(s);
}

/* ===== 殿前香客（Q 版背影，球狀漸層做出立體感） ===== */
const actors = [];
// 八位香客：ChatGPT 生成的 Q 版 3D 背影素材（透明背景，同一比例尺，小孩本來就比較矮）
const PEOPLE = ['grandma','grandpa','woman','man-cap','child','uncle-hat','student','office'].map(f => ({ file:f }));
PEOPLE.forEach(p => { const i = new Image(); i.src = `assets/people/${p.file}.webp`; }); // 預先載入，走進來時不閃
// 站位依這張正殿照片的地面挑選：避開神像正前方。b 越大越靠後（越小、越在後層），s 為遠近比例
const SLOTS = [
  { x:66, b:3,  s:1 },    // 0：使用者自己的位置
  { x:14, b:2,  s:1 },
  { x:86, b:5,  s:.94 },
  { x:38, b:1,  s:1.06 },
  { x:25, b:9,  s:.86 },
  { x:77, b:11, s:.84 }
];
const slotX = i => SLOTS[i]?.x ?? 50;
const MAX_ACTORS = 6;      // 畫面上同時最多幾位（含路過的人）
const WALK_SPEED = 0.055;  // 每移動 1% 寬度需要的秒數
function place(a, sl){
  sl = sl || SLOTS[a.slot] || SLOTS[0];
  a.el.style.bottom = sl.b + '%';
  a.el.style.zIndex = 20 - sl.b;               // 越前面越上層
  a.el.style.setProperty('--s', sl.s || 1);
}
function walkTo(a, x, done){
  const from = parseFloat(a.el.style.left) || 0, dur = Math.max(.8, Math.abs(x - from) * WALK_SPEED);
  a.el.classList.add('walk');
  a.el.classList.toggle('flip', x < from);       // 往左走時轉向
  a.el.style.transitionDuration = dur + 's, .6s';
  a.el.style.left = x + '%';
  clearTimeout(a.walkT);
  a.walkT = setTimeout(() => { a.el.classList.remove('walk', 'flip'); done && done(); }, dur * 1000);
}
function makeActor(mine){
  const p = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  const el = document.createElement('div');
  el.className = 'figure' + (mine ? ' mine' : '');
  el.innerHTML = `<img src="assets/people/${p.file}.webp" alt="" draggable="false">` + (mine ? '<span class="me">你</span>' : '');
  return { el, p, mine, leaving:false, slot:-1 };
}
function freeSlot(){
  const used = actors.filter(a => !a.leaving && a.slot >= 0).map(a => a.slot);
  const free = [1,2,3,4,5].filter(s => !used.includes(s));
  return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
}
function addActor({ mine=false, slot }){
  const live = actors.filter(a => !a.leaving);
  if (!mine && live.length >= MAX_ACTORS) { bumpOverflow(); return null; }
  const a = makeActor(mine);
  a.slot = mine ? 0 : (slot ?? freeSlot());
  if (a.slot < 0) return null;
  if (mine) { // 自己的位置被占用時，請對方先離開
    const o = live.find(x => x.slot === 0); if (o) leave(o, 0);
  }
  a.el.style.left = slotX(a.slot) < 50 ? '-16%' : '116%'; // 從離站位較近的一側走進來
  place(a);
  $('#scene').appendChild(a.el);
  actors.push(a);
  requestAnimationFrame(() => requestAnimationFrame(() => walkTo(a, slotX(a.slot))));
  return a;
}
function plaque(text, sub, a){
  // 祝福文字牌：一次只顯示一則，有事件才出現；浮在香客上方，不遮神像
  document.querySelectorAll('.plaque').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'plaque';
  p.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : '');
  p.classList.add(a && slotX(a.slot) < 50 ? 'l' : 'r');
  p.style.bottom = '34%'; // 低於神將頭部的高度
  $('#scene').appendChild(p);
  requestAnimationFrame(() => p.classList.add('on'));
  plaqueUntil = Date.now() + 5200;
  setTimeout(() => { p.classList.remove('on'); setTimeout(() => p.remove(), 400); }, 5200);
}
let plaqueUntil = 0;
function bow(a){ a.el.classList.add('bow'); }
function leave(a, ms){
  setTimeout(() => {
    if (a.leaving) return;
    a.leaving = true; a.el.classList.remove('bow');
    const x = parseFloat(a.el.style.left) || 50;
    const out = Math.random() < .5 ? (x < 50 ? -16 : 116) : (x < 50 ? 116 : -16); // 有時從另一側離開，像穿過殿內
    walkTo(a, out, () => { a.el.remove(); const i = actors.indexOf(a); if (i > -1) actors.splice(i, 1); });
  }, ms);
}
let ovN = 0, ovT = null;
function bumpOverflow(){
  ovN++; $('#overflow').textContent = `另有 ${ovN} 份祝福`;
  clearTimeout(ovT); ovT = setTimeout(() => { ovN = 0; $('#overflow').textContent = ''; }, 20000);
}
function renderPresence(){
  $('#presence').textContent = S.online >= 3 ? `此刻 ${S.online} 人在線參與` : '此刻，還有人正在留下祝福';
}
/*
  殿前人流（之後由後端 venue_event 驅動，每個角色對應一筆真實事件）：
  - 祈福（55%）：走到空位 → 合掌 → 停留 → 離開；約一半會冒出祝福牌
  - 路過（30%）：沿著殿前地面從一側走到另一側，不停留
  - 看看就走（15%）：走進來站一下，沒有合掌就離開
*/
function passBy(){
  const live = actors.filter(a => !a.leaving);
  if (live.length >= MAX_ACTORS) return;
  const a = makeActor(false);
  const fromLeft = Math.random() < .5, sl = { b: [1,4,8][Math.floor(Math.random()*3)], s: 1 };
  sl.s = sl.b > 6 ? .86 : 1;
  a.el.style.left = fromLeft ? '-16%' : '116%';
  place(a, sl);
  $('#scene').appendChild(a.el);
  actors.push(a);
  a.leaving = true; // 路過的人不占站位
  requestAnimationFrame(() => requestAnimationFrame(() =>
    walkTo(a, fromLeft ? 116 : -16, () => { a.el.remove(); const i = actors.indexOf(a); if (i > -1) actors.splice(i, 1); })));
}
function calmScene(){
  document.querySelectorAll('.plaque').forEach(p => p.remove()); plaqueUntil = 0;
  actors.filter(a => !a.mine && !a.leaving).forEach((a, i) => leave(a, 300 + i * 250));
}
function simulateOther(){
  if (S.step !== 'home') return;
  const r = Math.random();
  if (r < .30) { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) passBy(); return; }
  const a = addActor({});
  if (!a) return;
  const arrive = Math.abs(slotX(a.slot) - (slotX(a.slot) < 50 ? -16 : 116)) * WALK_SPEED * 1000;
  if (r < .85) {
    setTimeout(() => {
      bow(a);
      if (Math.random() < .5 && Date.now() > plaqueUntil && S.step === 'home') plaque(OTHERS[Math.floor(Math.random()*OTHERS.length)], '一位香客', a);
      S.today.blessings++; const n = $('#nBless'); if (n) n.textContent = S.today.blessings;
      leave(a, 3500 + Math.random()*3500);
    }, arrive + 500 + Math.random()*1200);
  } else leave(a, arrive + 1500 + Math.random()*1500);
}
(function loop(){ setTimeout(() => { simulateOther(); loop(); }, 1800 + Math.random()*2600); })();
setInterval(() => { S.online = Math.max(2, S.online + (Math.random() < .5 ? -1 : 1)); renderPresence(); }, 7000);

/* ===== 為上牆心願集氣 ===== */
// 卡片只放卡種、隱碼姓名、心願；不顯示集氣累計數，避免變成人氣比賽
function wishCard(c){
  const st = cheered.has(c.id) ? 'done' : (S.cheer[c.id] || 'idle');
  const label = { idle:'為他集氣', busy:'集氣中…', done:'你已集氣', fail:'未成功，請再試一次' }[st];
  return `<article class="wish" data-id="${c.id}">
    <div class="wmeta"><span class="wtype">${esc(c.type)}</span><span>${esc(maskName(c))}</span></div>
    <p>${esc(c.w)}</p>
    <div class="wfoot">
      <button class="cheer ${st}" type="button" data-id="${c.id}" ${st === 'busy' || st === 'done' ? 'disabled' : ''} aria-live="polite">${label}</button>
      ${st === 'done' && S.justCheered === c.id ? '<span class="look">抬頭看牆，這張卡會亮起 +1</span>' : ''}
    </div>
  </article>`;
}
// 只更新那一張卡，不重畫整頁，橫滑位置不會跳掉
function paintCard(id){
  const old = document.querySelector(`.wish[data-id="${id}"]`); if (!old) return;
  const t = document.createElement('div'); t.innerHTML = wishCard(WALL_CARDS.find(c => c.id === id)).trim();
  old.replaceWith(t.firstChild);
}
function cheer(id){
  if (cheered.has(id) || S.cheer[id] === 'busy') return;
  S.cheer[id] = 'busy'; paintCard(id);
  // 後端寫入成功才算數，也才通知牆面播「+1 集氣」；失敗時按鈕恢復可再按
  setTimeout(() => {
    cheered.add(id); saveCheered(); S.cheer[id] = 'done'; S.justCheered = id; paintCard(id);
  }, 500);
}

/* ===== 流程 ===== */
function startBless(){
  S.step = 'bless'; S.sent = false; S.sending = false; S.failed = false; S.stamped = false; S.phrase = null; S.wall = null;
  calmScene(); // 選句時殿前安靜下來，只留你的小人
  if (!me || me.leaving) me = addActor({ mine:true });
  render();
  window.scrollTo({ top:0 });
}
function send(){
  if (!S.phrase || S.sent || S.sending) return;
  S.sending = true; render();
  // 後端 accepted 後才蓋印；失敗時 S.failed = true，按鈕變「重試送出」
  setTimeout(() => {
    S.sending = false; S.sent = true; S.wall = 'waiting'; S.today.blessings++;
    if (!me || me.leaving) me = addActor({ mine:true });
    bow(me); plaque(S.phrase, '你的祝福', me);
    render(); // 不自動跳頁：停在合掌這一刻，由使用者按「製作專屬祈福卡」
  }, 450);
}
async function apply(){
  const btn = $('#apply'); btn.disabled = true; btn.textContent = '已複製祝福，前往中…';
  const copy = navigator.clipboard ? navigator.clipboard.writeText(S.phrase || '').catch(() => {}) : Promise.resolve();
  await Promise.race([copy, new Promise(r => setTimeout(r, 250))]); // 複製最多等 0.25 秒就出發
  location.href = S.topic.apply;
}
// 送出祝福後就先預載商品填寫頁，按下去時比較快
function prefetchApply(url){
  if (document.querySelector(`link[rel=prefetch][href="${url}"]`)) return;
  const l = document.createElement('link'); l.rel = 'prefetch'; l.href = url; document.head.appendChild(l);
}
/* ===== 殿前互動／即時直播切換 ===== */
let ytLoaded = false;
function setMode(m){
  S.mode = m;
  if (m === 'live') {
    if (!ytLoaded) { ytLoaded = true; loadYT(); } // 第一次切到直播才載入 YouTube，省流量
    else if (yt && ytReady) { try { yt.playVideo(); } catch(e){} }
  } else if (yt && ytReady) { try { yt.pauseVideo(); } catch(e){} }
  sizeMedia(); renderMedia();
}
$('#modeBtn').onclick = () => setMode(S.mode === 'photo' ? 'live' : 'photo');

sizeMedia(); renderMedia(); renderPresence(); render();
window.addEventListener('resize', () => { sizeMedia(); renderMedia(); syncDock(); });
// 分頁回到前景時再試一次自動播放（背景分頁會被瀏覽器擋自動播放）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.mode === 'live' && yt && ytReady && S.player !== 'playing') {
    try { yt.mute(); yt.playVideo(); } catch(e){}
  }
});
setTimeout(simulateOther, 2000);
</script>
