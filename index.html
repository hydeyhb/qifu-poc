<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<title>北港朝天宮・殿前祈福</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/*
  視覺規格「當代廟宇工藝・輕量版」（Claude × ChatGPT 收斂）：
  - 宮廟感只來自三處：正殿直播、殿前剪紙香客、送祝福的紅籤條。其他元件回到簡潔可讀。
  - 六色：硃紅 #7A2A24、暖金 #C99B54、紙白 #F7F3EC、淡紙褐 #E8DDCE、木褐 #3E2F26、灰褐 #8B8073。
  - 標題與祝福句用思源宋體，功能文字用思源黑體。
  - 不用常駐陰影、不用祥雲屋簷梅花、不用圖示庫。主按鈕圓角 10px，籤條 4px，心願卡 6px。
  - 頁首維持紙白：Lifemap 標誌是紅字，放在深紅底上會看不見。
*/
:root{
  --red:#7A2A24; --red-press:#652019; --gold:#C99B54;
  --paper:#F7F3EC; --paper-deep:#E8DDCE; --wood:#3E2F26; --wood-2:#30231D; --muted:#8B8073;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9E2D8;color:var(--wood);font:400 16px/1.65 var(--sans)}
button{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}
.app.nosticky{padding-bottom:24px}

/* 頁首（不固定：固定頁首捲動時會蓋到直播播放器） */
.hdr{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--paper-deep)}
.hdr img{height:26px;width:auto;display:block}

/* 廟名列 */
.venue{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 14px}
.venue h1{margin:0;font:700 24px/1.3 var(--serif);letter-spacing:.04em;text-wrap:balance}
.venue p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on{color:var(--red)}
.live.on i{background:#C0392B;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* 正殿直播：高度 = max(200px, 寬 × 9/16)，播放器上方不放任何元素 */
.media{position:relative;width:100%;background:#1E1612}
.media .yt,.media .yt iframe{width:100%;height:100%;display:block;border:0}
.fallback{position:absolute;inset:0;background:#2A1C16 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--paper);text-align:center;font-size:15px}
.fallback::before{content:"";position:absolute;inset:0;background:rgba(30,22,18,.62)}
.fallback > *{position:relative}
.fallback .tag{position:absolute;left:12px;top:12px;font-size:13px;color:var(--paper-deep)}
.fallback a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:10px;background:var(--paper);color:var(--red);font-weight:700;text-decoration:none}
.fallback .bar{width:120px;height:2px;background:rgba(247,243,236,.25);overflow:hidden}
.fallback .bar::after{content:"";display:block;width:40%;height:100%;background:var(--gold);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* 殿前舞台：唯一允許剪紙人物的地方 */
.stage{position:relative;height:108px;overflow:hidden;background:linear-gradient(180deg,var(--wood-2) 0%,var(--wood) 45%,#6A4F3E 100%);border-top:1px solid var(--gold);transition:height .45s var(--ease)}
.stage .line{position:absolute;left:16px;right:16px;bottom:18px;height:1px;background:rgba(201,155,84,.35)}
.stage.slim{height:96px}
.figure{position:absolute;bottom:10px;width:40px;height:60px;transform:translateX(-50%);transition:left 1.1s var(--ease),opacity .5s;z-index:2}
.figure svg{width:100%;height:100%;overflow:visible;transform-origin:50% 95%;transition:transform .6s var(--ease)}
.figure .head{transition:transform .6s var(--ease)}
.figure.bow svg{transform:rotate(-6deg)}
.figure.bow .head{transform:translateY(3px)}
.figure.out{opacity:0}
.figure .me{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:.1em}
.plaque{position:absolute;top:10px;left:50%;transform:translate(-50%,-4px);z-index:3;max-width:calc(100% - 32px);width:max-content;background:var(--paper);color:var(--wood);border:1px solid var(--gold);border-radius:4px;padding:4px 14px;font:600 15px/1.5 var(--serif);text-align:center;opacity:0;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.plaque.on{opacity:1;transform:translate(-50%,0)}
.plaque small{font:400 12px/1.4 var(--sans);color:var(--muted);margin-left:8px}
.overflow{position:absolute;right:16px;bottom:24px;font-size:13px;color:var(--paper-deep);z-index:3}

/* 內容 */
.sec{padding:24px 16px 0;animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h2{margin:0 0 14px;font:600 21px/1.4 var(--serif);letter-spacing:.02em;text-wrap:balance}
.lead{margin:-6px 0 16px;font-size:15px;color:var(--muted)}

.ticker{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.wish{flex:0 0 82%;scroll-snap-align:start;background:rgba(232,221,206,.55);border-left:3px solid var(--red);border-radius:6px;padding:14px}
.wish p{margin:0;font:600 17px/1.55 var(--serif)}
.wish span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.today{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;padding:4px 0}
.today div + div{border-left:1px solid var(--paper-deep);padding-left:20px}
.today strong{display:block;font-size:27px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.2}
.today span{font-size:14px}
.more-link{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-top:20px;border-top:1px solid var(--paper-deep);border-bottom:1px solid var(--paper-deep);text-decoration:none;font-size:16px;font-weight:500}
.more-link span:last-child{color:var(--muted);font-size:20px}

/* 送祝福：主題頁籤＋紅籤條 */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--paper-deep);margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 0 10px;font-size:17px;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--wood);font-weight:700}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.slips{display:flex;flex-direction:column;gap:10px}
.slip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:66px;text-align:left;border:1px solid transparent;background:var(--paper-deep);border-radius:4px;padding:12px 18px;font:600 19px/1.4 var(--serif);color:var(--wood);cursor:pointer;transition:background .2s,color .2s,transform .15s var(--ease)}
.slip:active{transform:scale(.99)}
.slip .tick{font:700 15px var(--sans);color:var(--gold);opacity:0;transition:opacity .2s}
.slip[aria-checked="true"]{background:var(--red);color:var(--paper);border-color:var(--gold)}
.slip[aria-checked="true"] .tick{opacity:1}
.slip:disabled{cursor:default}
.slip:disabled:not([aria-checked="true"]){opacity:.4}
.note{margin:14px 0 0;font-size:14px;color:var(--muted)}
/* 朱印：快速祝福被接受後才蓋，不代表正式卡審核或牆面已播放 */
.stamp{position:absolute;right:56px;top:50%;width:56px;height:56px;margin-top:-28px;border:2px solid #E7B9AE;color:#F7E4DE;display:grid;place-items:center;font:700 15px/1.15 var(--serif);text-align:center;opacity:0;transform:scale(1.25) rotate(-5deg);pointer-events:none}
.stamp.on{animation:stamp .26s ease-out forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-3deg)}}

/* 狀態列 */
.status{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);padding:12px 0;border-bottom:1px solid var(--paper-deep);margin-bottom:20px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:0 0 8px}
.status.ok{color:#3F6B4E}
.status.ok i{background:#3F6B4E}

/* 祈福卡預覽（示意，正式卡以各廟母版為準） */
.preview{position:relative;display:grid;grid-template-columns:30% 1fr;min-height:136px;border-radius:6px;overflow:hidden;background:var(--paper-deep)}
.preview .side{background:var(--red);color:var(--paper);display:flex;align-items:center;justify-content:center;font:700 22px var(--serif);letter-spacing:.25em;writing-mode:vertical-rl}
.preview .body{padding:16px;font-size:14px;color:var(--muted);line-height:1.7}
.preview .body b{display:block;margin:2px 0 4px;font:600 18px/1.5 var(--serif);color:var(--wood)}
.preview .flag{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:20px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:baseline;padding:10px 0;font-size:16px;border-bottom:1px solid var(--paper-deep)}
.steps li::before{content:counter(s);font:700 18px var(--serif);color:var(--red);width:14px;flex:0 0 14px}

/* 底部主按鈕列（播放器在頁首；底部留白等高，不會蓋到播放器） */
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--paper-deep);text-align:center}
.app.nosticky .dock{position:static;transform:none;border-top:0}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:18px;font-weight:700;letter-spacing:.06em;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s var(--ease)}
.cta:active{background:var(--red-press);transform:scale(.99)}
.cta:disabled{background:var(--paper-deep);color:var(--muted);cursor:not-allowed}
.cta.done{background:#3F6B4E}
.sub{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.back{display:block;margin:18px auto 0;border:0;background:none;color:var(--muted);font-size:15px;padding:10px;cursor:pointer}
.cta:focus-visible,.back:focus-visible,.slip:focus-visible,.tabs button:focus-visible,.more-link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 頁尾與 POC 控制（內部討論用） */
.foot{padding:36px 16px 8px;text-align:center;font-size:12.5px;color:var(--muted)}
.foot button{border:1px solid var(--paper-deep);background:none;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:40;max-width:88%;background:var(--wood);color:var(--paper);font-size:14.5px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.poc{position:fixed;inset:0;z-index:50;background:rgba(30,22,18,.45);display:flex;align-items:flex-end;justify-content:center}
.poc .box{background:var(--paper);border-radius:12px 12px 0 0;width:100%;max-width:440px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));font-size:15px;max-height:85dvh;overflow:auto}
.poc h3{margin:4px 0 8px;font:600 17px var(--serif)}
.poc label{display:flex;gap:10px;align-items:center;min-height:40px}
.poc input{width:18px;height:18px;accent-color:var(--red)}
.poc p{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stamp.on{opacity:1;transform:rotate(-3deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <img src="https://maitemple.s3.ap-northeast-1.amazonaws.com/temple/0OIPdI35qsi2nOvJV4jI/mini_app/header_logo_0OKe6VOuuaPb8Vhc9yIA.jpeg" alt="人生地圖 Lifemap">
  </header>

  <section class="venue" aria-label="場域">
    <div>
      <h1>北港朝天宮・正殿</h1>
      <p id="presence"></p>
    </div>
    <span class="live" id="liveChip"><i></i><span id="liveText">連線中</span></span>
  </section>

  <div class="media" id="media">
    <div class="yt" id="yt"></div>
    <div class="fallback" id="fallback" hidden></div>
  </div>

  <div class="stage" id="stage" aria-label="殿前">
    <div class="line"></div>
    <span class="overflow" id="overflow"></span>
  </div>

  <main id="view"></main>

  <footer class="foot">
    <button type="button" id="pocBtn">POC 控制</button>
    <p>POC 版本：人數、統計、其他香客與牆面回報為模擬資料。</p>
  </footer>

  <div class="dock" id="dock"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 設定 ===== */
const CFG = {
  videoId: 'B12MobI0EGg',
  youtubeUrl: 'https://www.youtube.com/live/B12MobI0EGg',
  photo: 'https://i.ytimg.com/vi/B12MobI0EGg/hqdefault.jpg', // 正式版換成廟方核准的正殿照片
  groupUrl: 'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/',
  topics: [
    { id:'study', name:'學業', product:'金榜題名祈福卡', side:'金榜題名',
      apply:'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/apply/item/0OjUzsvZSiV2nNhPtu8p/?neworder=true',
      phrases:['願考試順利，金榜題名','願讀書專注，心定不慌','願努力都有好結果'] },
    { id:'career', name:'事業', product:'業績長紅祈福卡', side:'業績長紅',
      apply:'https://lifemap.miniapp.tw/home/group/0P2-KwZoI4KhX5lp6miq/apply/item/0P1f6x1i2RH_NpRKm0FD/?neworder=true',
      phrases:['願工作順心，貴人相助','願生意興隆，訂單滿滿','願升遷順利，一路長紅'] }
  ]
};
// 正式版的其他香客事件來自後端 venue_event；POC 在本機模擬
const OTHERS = ['願考試順利，金榜題名','願工作順心，貴人相助','願讀書專注，心定不慌','願生意興隆，訂單滿滿','願努力都有好結果'];
const RECENT = [
  { w:'願女兒考試順利，考上第一志願', t:'12 分鐘前上牆' },
  { w:'願今年業績長紅，客戶都順利成交', t:'40 分鐘前上牆' },
  { w:'願全家平安，阿嬤身體健康', t:'1 小時前上牆' }
];

/* ===== 狀態 ===== */
const S = {
  step:'home', topic:CFG.topics[0], phrase:null, sent:false, wall:null,
  source:'live', player:'loading', force:'auto', simOthers:true,
  online:7, today:{ wishes:36, blessings:58 }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== 正殿直播 ===== */
let yt = null, ytReady = false, stallT = null;
function canEmbed(){ return $('#media').clientWidth >= 300 && window.innerHeight >= 560; }
function sizeMedia(){
  const w = $('#media').clientWidth;
  $('#media').style.height = Math.max(200, Math.round(w * 9 / 16)) + 'px';
  $('#app').classList.toggle('nosticky', window.innerHeight < 560);
}
function uiState(){
  if (S.force !== 'auto') return S.force;
  if (S.source === 'none') return 'none';
  if (!canEmbed()) return 'small';
  if (S.source === 'offline') return 'offline';
  if (S.player === 'playing') return 'live';
  if (S.player === 'blocked') return 'blocked';
  if (S.player === 'error' || S.player === 'stalled') return 'error';
  return 'connecting';
}
function renderMedia(){
  const st = uiState(), fb = $('#fallback');
  // 播放器準備好就保持可見（隱藏會被 YouTube 暫停）；自動播放被擋時直接露出 YouTube 自己的播放鍵
  const showYt = st === 'live' || (ytReady && (st === 'connecting' || st === 'blocked'));
  $('#yt').style.visibility = showYt ? 'visible' : 'hidden';
  fb.hidden = showYt;
  fb.style.backgroundImage = `url("${CFG.photo}")`;
  const M = {
    connecting:['連線中',false,'<div>直播連線中</div><div class="bar"></div>'],
    live:['直播中',true,''],
    blocked:['點播放看直播',true,''],
    error:['暫停',false,'<div>直播暫時無法播放</div>'],
    offline:['照片',false,'<span class="tag">廟內照片</span><div>直播暫停，先看看廟內</div>'],
    none:['照片',false,'<span class="tag">廟內照片</span>'],
    small:['直播中',true,`<div>畫面較小，請到 YouTube 觀看</div><a href="${CFG.youtubeUrl}" target="_blank" rel="noopener">觀看直播</a>`]
  }[st];
  $('#liveText').textContent = M[0];
  $('#liveChip').classList.toggle('on', M[1]);
  fb.innerHTML = M[2];
}
window.onYouTubeIframeAPIReady = function(){
  if (!canEmbed()) { renderMedia(); return; }
  yt = new YT.Player('yt', {
    videoId: CFG.videoId,
    playerVars: { autoplay:1, mute:1, playsinline:1, rel:0, controls:1 },
    events: {
      onReady: e => {
        ytReady = true; renderMedia(); // 先讓播放器可見，再要求播放
        e.target.mute(); e.target.playVideo();
        setTimeout(() => { if (S.player !== 'playing') { S.player = 'blocked'; renderMedia(); } }, 5000);
      },
      onStateChange: e => {
        const P = YT.PlayerState; clearTimeout(stallT);
        if (e.data === P.PLAYING) S.player = 'playing';
        else if (e.data === P.BUFFERING) { if (S.player !== 'playing') S.player = 'loading'; stallT = setTimeout(() => { S.player = 'stalled'; renderMedia(); }, 20000); }
        else if (e.data === P.ENDED) S.player = 'error';
        else if (e.data === P.PAUSED) S.player = 'blocked';
        renderMedia();
      },
      onError: () => { S.player = 'error'; renderMedia(); } // 只代表這支手機播不了，不改後端的直播狀態
    }
  });
};
function loadYT(){
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { S.player = 'error'; renderMedia(); };
  document.head.appendChild(s);
}

/* ===== 殿前剪紙香客 ===== */
const actors = [];
function figure(fill){
  // 平面剪紙：頭、髮髻、肩背、合掌輪廓、坐墊。不畫五官與衣紋
  return `<svg viewBox="0 0 40 60" aria-hidden="true">
    <ellipse cx="20" cy="56" rx="17" ry="3.6" fill="#5A2018" stroke="#C99B54" stroke-width="1"/>
    <path d="M3 55 C3 44 7 36.5 13.5 34.5 L26.5 34.5 C33 36.5 37 44 37 55 Z" fill="${fill}" stroke="#C99B54" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M15 34.5 L20 40 L25 34.5" fill="none" stroke="#C99B54" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M20 40 L20 55" stroke="rgba(201,155,84,.45)" stroke-width="1"/>
    <rect x="17" y="29.5" width="6" height="5.5" fill="#161010"/>
    <g class="head">
      <circle cx="20" cy="21" r="8.8" fill="#161010" stroke="#C99B54" stroke-width="1.2"/>
      <circle cx="20" cy="10.6" r="3.6" fill="#161010" stroke="#C99B54" stroke-width="1.2"/>
    </g>
  </svg>`;
}
const slotX = i => [50, 26, 74][i] ?? 50;
function addActor({ mine=false }){
  const live = actors.filter(a => !a.leaving);
  if (live.length >= 3 && !mine) { bumpOverflow(); return null; }
  const el = document.createElement('div');
  el.className = 'figure';
  el.innerHTML = figure(mine ? '#9A3A2E' : '#7A2A24') + (mine ? '<span class="me">你</span>' : '');
  el.style.left = Math.random() < .5 ? '-12%' : '112%';
  $('#stage').appendChild(el);
  const used = live.map(x => x.slot);
  const a = { el, mine, leaving:false, slot: mine ? 0 : ([1,2,0].find(s => !used.includes(s)) ?? 1) };
  if (mine) {
    const o = live.find(x => x.slot === 0);
    if (o) { o.slot = [1,2].find(s => !used.includes(s)) ?? 1; o.el.style.left = slotX(o.slot) + '%'; }
  }
  actors.push(a);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.left = slotX(a.slot) + '%'; }));
  return a;
}
function plaque(text, sub){
  // 祝福文字牌：一次只顯示一則，有事件才出現
  document.querySelectorAll('.plaque').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'plaque';
  p.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : '');
  $('#stage').appendChild(p);
  requestAnimationFrame(() => p.classList.add('on'));
  setTimeout(() => { p.classList.remove('on'); setTimeout(() => p.remove(), 400); }, 5200);
}
function bow(a){ a.el.classList.add('bow'); }
function leave(a, ms){
  setTimeout(() => {
    a.leaving = true; a.el.classList.remove('bow');
    a.el.style.left = a.slot === 2 ? '112%' : '-12%'; a.el.classList.add('out');
    setTimeout(() => { a.el.remove(); const i = actors.indexOf(a); if (i > -1) actors.splice(i, 1); }, 1200);
  }, ms);
}
let ovN = 0, ovT = null;
function bumpOverflow(){
  ovN++; $('#overflow').textContent = `另有 ${ovN} 份祝福`;
  clearTimeout(ovT); ovT = setTimeout(() => { ovN = 0; $('#overflow').textContent = ''; }, 20000);
}
function renderPresence(){
  $('#presence').textContent = S.online >= 3 ? `此刻 ${S.online} 人在線參與` : '此刻，還有人正在留下祝福';
}
function simulateOther(){
  if (!S.simOthers) return;
  const a = addActor({});
  if (!a) return;
  if (Math.random() < .75) {
    setTimeout(() => {
      bow(a); plaque(OTHERS[Math.floor(Math.random()*OTHERS.length)], '一位香客');
      S.today.blessings++; const n = $('#nBless'); if (n) n.textContent = S.today.blessings;
      leave(a, 6500);
    }, 2500 + Math.random()*4000);
  } else leave(a, 15000); // 15 秒內沒送出就離開，不做祈福動作
}
(function loop(){ setTimeout(() => { simulateOther(); loop(); }, 9000 + Math.random()*9000); })();
setInterval(() => { S.online = Math.max(2, S.online + (Math.random() < .5 ? -1 : 1)); renderPresence(); }, 7000);

/* ===== 畫面 ===== */
let me = null;
function render(){
  const v = $('#view'), d = $('#dock');
  $('#media').hidden = S.step === 'card';
  $('#stage').classList.toggle('slim', S.step === 'card');
  if (S.step === 'card' && yt && ytReady) { try { yt.pauseVideo(); } catch(e){} }
  if (S.step !== 'card' && yt && ytReady && S.player !== 'playing') { try { yt.playVideo(); } catch(e){} }

  if (S.step === 'home') {
    v.innerHTML = `
      <section class="sec">
        <h2 class="h2">大家剛留下的心願</h2>
        <div class="ticker">
          ${RECENT.map(r => `<article class="wish"><p>${esc(r.w)}</p><span>${esc(r.t)}・已通過審核</span></article>`).join('')}
        </div>
        <div class="today" aria-label="今天這間廟">
          <div><strong>${S.today.wishes}</strong><span>今天的祈福卡</span></div>
          <div><strong id="nBless">${S.today.blessings}</strong><span>今天的祝福</span></div>
        </div>
        <a class="more-link" href="${CFG.groupUrl}" target="_blank" rel="noopener"><span>直接寫祈福卡</span><span aria-hidden="true">›</span></a>
      </section>`;
    d.innerHTML = `<button class="cta" id="go" type="button">免費送一句祝福</button><span class="sub">不用打字・你的小人會走到殿前合掌</span>`;
    $('#go').onclick = startBless;
  }

  if (S.step === 'bless') {
    const t = S.topic;
    v.innerHTML = `
      <section class="sec">
        <h2 class="h2">選一句想送出的祝福</h2>
        <p class="lead">免登入、免付費。祝福句由廟方事先核准。</p>
        <div class="tabs" role="tablist" aria-label="祝福主題">
          ${CFG.topics.map(x => `<button type="button" role="tab" data-t="${x.id}" aria-selected="${x.id===t.id}" ${S.sent?'disabled':''}>${x.name}</button>`).join('')}
        </div>
        <div class="slips" role="radiogroup" aria-label="祝福句">
          ${t.phrases.map(p => `<button type="button" class="slip" role="radio" aria-checked="${p===S.phrase}" data-p="${esc(p)}" ${S.sent?'disabled':''}>${esc(p)}<span class="tick">已選</span>${p===S.phrase&&S.sent?'<span class="stamp" id="stamp">祝福<br>已送</span>':''}</button>`).join('')}
        </div>
        <button class="back" type="button" id="back">先不用，回到殿前</button>
      </section>`;
    d.innerHTML = S.sent
      ? `<button class="cta done" type="button" disabled style="background:#3F6B4E;color:#fff">祝福已送到殿前</button><span class="sub">接著可以把它寫成祈福卡</span>`
      : `<button class="cta" id="send" type="button" ${S.phrase?'':'disabled'}>${S.phrase?'送出這句祝福':'先選一句祝福'}</button><span class="sub">送出後，你的小人會在殿前合掌</span>`;
    v.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.topic = CFG.topics.find(x => x.id === b.dataset.t); S.phrase = null; render(); });
    v.querySelectorAll('.slip').forEach(b => b.onclick = () => { S.phrase = b.dataset.p; render(); });
    $('#back').onclick = () => { if (me && !S.sent) { leave(me, 0); me = null; } S.step = 'home'; render(); };
    const s = $('#send'); if (s) s.onclick = send;
    const st = $('#stamp'); if (st) requestAnimationFrame(() => st.classList.add('on'));
  }

  if (S.step === 'card') {
    const t = S.topic;
    v.innerHTML = `
      <section class="sec">
        ${statusLine()}
        <h2 class="h2">把這句祝福，寫成一張祈福卡</h2>
        <p class="lead">快速祝福只會短暫出現。寫成${esc(t.product)}，審核後會加入祈福牆的卡片輪播。</p>
        <div class="preview" aria-label="祈福卡預覽">
          <div class="side">${esc(t.side)}</div>
          <div class="body">北港朝天宮・文昌殿<b>${esc(S.phrase)}</b>祈福人：你的名字</div>
          <span class="flag">預覽・尚未送出</span>
        </div>
        <ol class="steps">
          <li>填姓名與 Email，貼上這句祝福</li>
          <li>選擇祈福心意金</li>
          <li>付款完成，祈福卡排入祈福牆</li>
        </ol>
        <button class="back" type="button" id="back2">先不用，回到殿前</button>
      </section>`;
    d.innerHTML = `<button class="cta" id="apply" type="button">寫成${esc(t.product)}</button><span class="sub">會先幫你複製這句祝福，到下一頁貼上</span>`;
    $('#apply').onclick = apply;
    $('#back2').onclick = () => { S.step = 'home'; S.sent = false; S.phrase = null; S.wall = null; render(); window.scrollTo({ top:0, behavior:'smooth' }); };
  }
}
function statusLine(){
  if (S.wall === 'played') return `<div class="status ok" id="statusLine"><i></i>你的祝福正在祈福牆上（示意）</div>`;
  if (S.wall === 'unconfirmed') return `<div class="status" id="statusLine"><i></i>祝福已送出，目前無法確認牆面展示</div>`;
  return `<div class="status" id="statusLine"><i></i>祝福已送出，祈福牆準備播放</div>`;
}

/* ===== 流程 ===== */
function startBless(){
  S.step = 'bless'; S.sent = false; S.phrase = null; S.wall = null;
  if (!me || me.leaving) me = addActor({ mine:true });
  render();
  window.scrollTo({ top: $('#media').offsetTop - 8, behavior:'smooth' });
}
function send(){
  if (!S.phrase || S.sent) return;
  // 正式版：後端 accepted 後才蓋印；失敗則停在原畫面可重試
  S.sent = true; S.wall = 'waiting'; S.today.blessings++;
  if (!me || me.leaving) me = addActor({ mine:true });
  setTimeout(() => { bow(me); plaque(S.phrase, '你的祝福'); }, 250);
  render();
  setTimeout(() => { S.wall = 'played'; const l = $('#statusLine'); if (l) l.outerHTML = statusLine(); }, 3000); // 正式版依牆端回報 wall_played
  setTimeout(() => { S.step = 'card'; render(); window.scrollTo({ top:0, behavior:'smooth' }); }, 1600);
  setTimeout(() => { if (me) { leave(me, 0); me = null; } }, 9000);
}
async function apply(){
  const text = S.phrase || '';
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  toast(ok ? '已複製祝福，到下一頁「祈福心願」貼上' : `下一頁請貼上：${text}`);
  setTimeout(() => { location.href = S.topic.apply; }, ok ? 900 : 2400);
}
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ===== POC 控制 ===== */
$('#pocBtn').onclick = () => {
  const box = document.createElement('div'); box.className = 'poc';
  const opts = [['auto','自動（依實際播放）'],['live','直播中'],['connecting','連線中'],['blocked','手機擋自動播放'],['error','這支手機播不了'],['offline','廟方直播暫停'],['none','這間廟沒有直播'],['small','螢幕太小']];
  box.innerHTML = `<div class="box" role="dialog" aria-label="POC 控制">
    <h3>直播狀態</h3>
    ${opts.map(([v,l]) => `<label><input type="radio" name="f" value="${v}" ${S.force===v?'checked':''}>${l}</label>`).join('')}
    <h3 style="margin-top:12px">其他香客</h3>
    <label><input type="checkbox" id="simChk" ${S.simOthers?'checked':''}>模擬其他香客入場與送祝福</label>
    <p>本頁是 POC：人數、統計、牆面播放回報與其他香客都是本機模擬，正式版由後端事件提供。直播為北港朝天宮正殿 YouTube 直播，播放器上方不疊任何元素。</p>
    <button type="button" class="cta" id="simNow" style="height:48px;font-size:16px">現在來一位香客</button>
    <button type="button" class="back" id="pocClose">關閉</button></div>`;
  document.body.appendChild(box);
  box.querySelectorAll('input[name=f]').forEach(r => r.onchange = () => { S.force = r.value; renderMedia(); });
  box.querySelector('#simChk').onchange = e => { S.simOthers = e.target.checked; };
  box.querySelector('#simNow').onclick = () => { const s = S.simOthers; S.simOthers = true; simulateOther(); S.simOthers = s; box.remove(); };
  box.querySelector('#pocClose').onclick = () => box.remove();
  box.onclick = e => { if (e.target === box) box.remove(); };
};

/* ===== 啟動 ===== */
sizeMedia(); renderMedia(); renderPresence(); render(); loadYT();
window.addEventListener('resize', () => { sizeMedia(); renderMedia(); });
// 分頁回到前景時再試一次自動播放（背景分頁會被瀏覽器擋自動播放）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && yt && ytReady && S.step !== 'card' && S.player !== 'playing') {
    try { yt.mute(); yt.playVideo(); } catch(e){}
  }
});
setTimeout(simulateOther, 2000);
</script>
